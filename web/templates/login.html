<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MeowMind Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f1115; color: #e5e7eb;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .box {
            background: #171a21; border: 1px solid #262b36;
            border-radius: 12px; padding: 32px; width: 320px;
        }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        label { display: block; margin: 12px 0 4px; font-size: 13px; color: #94a3b8; }
        input {
            width: 100%; background: #0f1115; border: 1px solid #2d3340;
            color: #e5e7eb; padding: 10px; border-radius: 6px;
        }
        button {
            width: 100%; margin-top: 20px; background: #2563eb; color: #fff;
            border: none; padding: 11px; border-radius: 6px; cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
        .error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <form class="box" method="post" action="/login">
        <h1>🐱 MeowMind Panel</h1>
        <label>Логин</label>
        <input type="text" name="username" autofocus>
        <label>Пароль</label>
        <input type="password" name="password">
        <button type="submit">Войти</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
